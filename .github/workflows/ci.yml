name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 学习点：用 node24 运行时的 action 版本（v4 是 node20，已被 GitHub 弃用并会打警告）。
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: 格式检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未格式化，请跑 gofmt -w ."; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: 测试
        run: go test ./...

      # 三端交叉编译在 release 里做，这里只确认主流程能编过（快）。
      - name: 构建
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null .
