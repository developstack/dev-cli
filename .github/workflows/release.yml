name: release

# 推一个 v* tag 就发版：构建三端（macOS / Linux / Windows × amd64 / arm64）并挂到 Release。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # 学习点（**为什么拆成两个 job**）：一开始把 action-gh-release 放在 matrix 里，
# 6 个 job 会**同时**去创建同一个 tag 的 Release —— 结果是每次发版都多出一个 Draft
# （实测 v0.1.1/v0.1.2 都出现了 6 个 job 抢建、最后留下一个 draft + 一个正式版）。
# 正确做法：矩阵只负责**构建并上传 artifact**，再由一个 job 统一建 Release。
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      # 学习点：用 node24 运行时的 action 版本（v4 是 node20，已被 GitHub 弃用并会打警告）。
      - uses: actions/checkout@v5

      # cache: false —— 本仓**零依赖**（没有 go.sum），开着缓存只会报 "Dependencies file is not found"。
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - name: 构建并打包
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi

          # 学习点：CGO_ENABLED=0 才能纯静态交叉编译（发布物不依赖目标机 libc）。
          # -X 把 tag 注入版本号，`dev-cli version` 就能报出真实版本。
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/developstack/dev-cli/internal/cli.Version=${GITHUB_REF_NAME}" \
            -o "dev-cli${ext}" .

          name="dev-cli_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            zip -q "${name}.zip" "dev-cli${ext}"
          else
            tar czf "${name}.tar.gz" "dev-cli${ext}"
          fi
          ls -lh dev-cli_*

      - uses: actions/upload-artifact@v7
        with:
          name: dev-cli_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dev-cli_${{ matrix.goos }}_${{ matrix.goarch }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: 列出产物（排查用）
        run: ls -lh dist

      # 单 job 建 Release —— 不会再抢建出 Draft。
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/dev-cli_*
          generate_release_notes: true
